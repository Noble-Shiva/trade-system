# BSE F&O Trading System Configuration

app:
  name: "BSE F&O Trading System"
  version: "0.1.0"
  environment: "development"  # development, paper, production

market:
  exchange: "BSE"  # BSE or NSE
  instruments:
    - "SENSEX"
    - "BANKEX"
  trading_hours:
    start: "09:15"
    end: "15:30"
    no_new_trades_after: "14:30"
    square_off_by: "15:15"

broker:
  name: "zerodha"  # zerodha, fyers, angel, upstox
  api_key: "${BROKER_API_KEY}"
  api_secret: "${BROKER_API_SECRET}"
  user_id: "${BROKER_USER_ID}"

strategies:
  active:
    - "iron_condor"
    - "bull_put_spread"
  default_strategy: "iron_condor"

  iron_condor:
    enabled: true
    min_premium: 50
    max_spread_width: 500
    delta_range: [0.15, 0.25]
    days_to_expiry: [7, 21]

  bull_put_spread:
    enabled: true
    min_premium: 30
    spread_width: 100
    delta: 0.30

risk:
  max_capital_per_trade_pct: 5.0
  max_daily_loss_pct: 2.0
  max_weekly_loss_pct: 5.0
  max_drawdown_pct: 10.0
  max_open_positions: 3

stop_loss:
  initial_sl_pct: 2.0
  trailing_start_pct: 1.5
  trail_pct: 0.5
  time_based:
    morning_multiplier: 0.8
    midday_multiplier: 1.0
    closing_multiplier: 1.2

capital:
  initial: 100000
  per_lot_margin: 15000

database:
  type: "postgresql"
  host: "localhost"
  port: 5432
  name: "trading_db"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"

redis:
  host: "localhost"
  port: 6379

notifications:
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587

logging:
  level: "INFO"
  file: "logs/trading.log"
  rotation: "1 day"
  retention: "30 days"

backtest:
  data_path: "data/historical"
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  initial_capital: 100000
  commission: 20  # per order in INR
